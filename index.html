<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2B211B">
<title>Чайхана Наваи — Электронное меню</title>

<style>
:root{
  --page:#3A2A20;
  --card:#4A3425;
  --cream:#F4E5C5;
  --gold:#C8943E;
  --lightgold:#E8C77A;
  --dark:#211711;
  --wine:#7D2F25;
  --text:#FFF4DC;
  --muted:#DCC7A2;
  --shadow:0 16px 36px #150e0a80;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  font:15px/1.5 Georgia,"Times New Roman",serif;
  background:
    radial-gradient(#c8943e12 1px,transparent 1px),
    linear-gradient(125deg,#3a2a20,#2b211b 55%,#3a2a20);
  background-size:22px 22px,auto;
}

button{font:inherit;cursor:pointer}

.hidden{display:none!important}

.welcome{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 30%,#69472980,transparent 45%),
    linear-gradient(145deg,#211711,#3a2a20);
}

.welcome-card{
  width:min(590px,100%);
  padding:42px 28px;
  text-align:center;
  border:1px solid var(--gold);
  border-radius:28px;
  background:#4a3425d9;
  box-shadow:var(--shadow);
}

.logo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

.logo-wrap{
  width:120px;
  height:120px;
  margin:0 auto;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
  background:var(--cream);
  box-shadow:0 0 0 1px var(--gold);
}

.welcome .logo-wrap{
  width:min(260px,70vw);
  height:150px;
  margin-bottom:18px;
}

.logo-fallback{
  color:var(--wine);
  font-weight:bold;
  text-align:center;
}

.welcome h1{
  margin:8px 0;
  font-size:clamp(28px,6vw,45px);
}

.welcome p{
  margin:4px;
  color:var(--muted);
  font-size:18px;
}

.prompt{
  margin:28px 0 15px!important;
  color:var(--lightgold)!important;
}

.lang-buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:0;
  border-radius:9px;
  color:var(--dark);
  background:var(--gold);
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  background:var(--lightgold);
  transform:translateY(-2px);
}

.btn.outline{
  color:var(--lightgold);
  background:transparent;
  border:1px solid var(--gold);
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px max(16px,calc((100vw - 1200px)/2));
  background:#211711ed;
  border-bottom:1px solid #c8943e99;
  backdrop-filter:blur(9px);
}

.topbar .logo-wrap{
  width:62px;
  height:62px;
  flex:none;
}

.brand{
  min-width:0;
  flex:1;
}

.brand strong{
  display:block;
  color:var(--lightgold);
  font-size:18px;
}

.brand span{
  color:var(--muted);
  font-size:12px;
}

.container{
  width:min(1200px,calc(100% - 32px));
  margin:0 auto;
  padding:34px 0 64px;
}

.hero{
  margin-bottom:28px;
  text-align:center;
}

.hero h2{
  margin:0;
  color:var(--cream);
  font-size:clamp(28px,5vw,44px);
}

.hero p{
  margin:8px;
  color:var(--muted);
}

.section-title{
  margin:18px 0;
  color:var(--lightgold);
  text-align:center;
  font-size:25px;
}

.section-title:after,
.site-footer:before{
  content:"✦ ❖ ✦";
  display:block;
  color:var(--lightgold);
  letter-spacing:10px;
  font-size:13px;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}

.category{
  min-height:178px;
  padding:21px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-end;
  position:relative;
  overflow:hidden;
  border:1px solid #c8943e99;
  border-radius:18px;
  background:linear-gradient(135deg,#4a3425,#34251c);
  box-shadow:var(--shadow);
}

.category:before{
  content:"❖";
  position:absolute;
  right:14px;
  top:-28px;
  color:#c8943e22;
  font-size:108px;
}

.category h3,
.category p,
.category button{
  position:relative;
  z-index:1;
}

.category h3{
  margin:0 0 5px;
  font-size:22px;
}

.category p{
  margin:0 0 16px;
  color:var(--muted);
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:24px;
}

.toolbar h2{
  margin:0;
  color:var(--cream);
  text-align:center;
  font-size:clamp(25px,5vw,38px);
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(265px,1fr));
  gap:18px;
}

.dish{
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:1px solid #c8943e99;
  border-radius:18px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.dish-photo,
.photo-fallback{
  display:block;
  width:100%;
  height:190px;
  object-fit:cover;
  background:linear-gradient(135deg,#7d2f25,#c8943e);
}

.photo-fallback{
  display:grid;
  place-items:center;
  padding:20px;
  color:var(--cream);
  text-align:center;
  font-size:19px;
  font-weight:bold;
}

.dish-body{
  padding:15px;
}

.dish h3{
  margin:0 0 8px;
  color:var(--cream);
  font-size:20px;
  line-height:1.18;
}

.description{
  margin:0 0 13px;
  color:var(--muted);
  font-size:14px;
}

.info{
  margin-top:7px;
  padding-top:9px;
  border-top:1px solid #c8943e44;
  font-size:13px;
}

.info b{
  color:var(--lightgold);
}

.nutrition{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
  margin:10px 0;
  color:var(--muted);
  font-size:12px;
}

.note{
  margin:0 0 12px;
  color:#dcc7a2aa;
  font-size:10px;
}

.price{
  color:var(--lightgold);
  font-size:21px;
  font-weight:bold;
}

.site-footer{
  margin-top:40px;
  padding:34px 20px 25px;
  text-align:center;
  background:linear-gradient(135deg,#211711,#3a2a20);
  border-top:1px solid var(--gold);
  box-shadow:0 -10px 30px #150e0a55;
}

.footer-brand h2{
  margin:14px 0 6px;
  color:var(--lightgold);
  font-size:25px;
}

.footer-brand p{
  margin:0 0 20px;
  color:var(--muted);
}

.footer-contacts{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:12px 24px;
  margin-bottom:22px;
}

.footer-contacts a{
  color:var(--cream);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:.2s;
}

.footer-contacts a:hover{
  color:var(--lightgold);
  border-bottom-color:var(--lightgold);
}

.photo-notice{
  max-width:720px;
  margin:0 auto;
  color:#dcc7a2aa;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:600px){
  .topbar{
    gap:8px;
    padding:7px 12px;
  }

  .brand strong{font-size:15px}
  .brand span{display:none}

  .container{
    width:min(100% - 22px,1200px);
    padding-top:24px;
  }

  .welcome-card{
    padding:32px 17px;
  }

  .menu-grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    align-items:flex-start;
  }

  .toolbar h2{
    max-width:60%;
    font-size:24px;
  }

  .category-grid{
    grid-template-columns:1fr 1fr;
  }

  .category{
    min-height:150px;
    padding:15px;
  }

  .category h3{
    font-size:18px;
  }

  .category p{
    font-size:12px;
  }

  .footer-contacts{
    flex-direction:column;
    gap:10px;
  }
}
</style>
</head>

let lang=localStorage.getItem('navai-lang')||'ru';
let currentCategory=null;

const $=selector=>document.querySelector(selector);
const tr=key=>T[lang][key];

function logoHTML(){
  return `
    <span class="logo-wrap">
      <img
        class="logo"
        src="${logo}"
        alt="${tr('restaurant')}"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{
          className:'logo-fallback',
          textContent:'Наваи'
        }))"
      >
    </span>
  `;
}

function welcome(){
  const welcomeBlock=$('#welcome');

  welcomeBlock.classList.remove('hidden');
  $('#app').classList.add('hidden');

  welcomeBlock.innerHTML=`
    <div class="welcome-card">
      ${logoHTML()}
      <h1>${tr('welcome')}</h1>
      <p>${tr('tagline')}</p>
      <p class="prompt">${tr('choose')}</p>

      <div class="lang-buttons">
        <button class="btn" onclick="selectLanguage('ru')">Русский</button>
        <button class="btn" onclick="selectLanguage('kg')">Кыргызча</button>
        <button class="btn" onclick="selectLanguage('en')">English</button>
      </div>
    </div>
  `;
}

function selectLanguage(selectedLanguage){
  lang=selectedLanguage;
  localStorage.setItem('navai-lang',lang);
  document.documentElement.lang=lang;
  currentCategory=null;
  renderApp();
}

function header(){
  return `
    <header class="topbar">
      ${logoHTML()}

      <div class="brand">
        <strong>${tr('restaurant')}</strong>
        <span>${tr('tagline')}</span>
      </div>

      <button class="btn outline small" onclick="welcome()">
        ${tr('change')}
      </button>
    </header>
  `;
}

function footer(){
  return `
    <footer class="site-footer">
      <div class="footer-brand">
        <h2>${tr('restaurant')}</h2>
        <p>${tr('tagline')}</p>
      </div>

        <a href="tel:+996701010503">

function renderApp(){
  $('#welcome').classList.add('hidden');

  const app=$('#app');
  app.classList.remove('hidden');

  app.innerHTML=`
    ${header()}

    <div class="container">
      ${currentCategory ? categoryView(currentCategory) : homeView()}
    </div>

    ${footer()}
  `;
}

function homeView(){
  return `
    <section class="hero">
      <h2>${tr('title')}</h2>
      <p>${tr('subtitle')}</p>
    </section>

    <h3 class="section-title">${tr('title')}</h3>

    <div class="category-grid">
      ${Object.entries(menuData).map(([id,category])=>`
        <article class="category">
          <h3>${category.title[lang]}</h3>
          <p>${category.caption[lang]}</p>
          <button class="btn small" onclick="openCategory('${id}')">
            ${tr('open')}
          </button>
        </article>
      `).join('')}
    </div>
  `;
}

function categoryView(id){
  const category=menuData[id];

  return `
    <div class="toolbar">
      <button class="btn outline" onclick="goHome()">
        ← ${tr('back')}
      </button>

      <h2>${category.title[lang]}</h2>

      <button class="btn outline small" onclick="goHome()">
        ${tr('home')}
      </button>
    </div>

    <div class="menu-grid">
      ${category.items.map(item=>dishCard(item)).join('')}
    </div>
  `;
}

function dishCard(item){
  const nutrition=item.nutrition;
  const safeName=item.name[lang].replace(/'/g,'');

  return `
    <article class="dish">
      <img
        class="dish-photo"
        src="${item.image}"
        alt="${item.name[lang]}"
        loading="lazy"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{
          className:'photo-fallback',
          textContent:'${safeName}'
        }))"
      >

      <div class="dish-body">
        <h3>${item.name[lang]}</h3>

        <p class="description">
          ${item.description[lang]}
        </p>

        <div class="info">
          <b>${tr('ingredients')}:</b>
          ${item.ingredients[lang]}
        </div>

        <div class="info">
          <b>${tr('weight')}:</b>
          ${item.weight}
        </div>

        <div class="info">
          <b>${tr('nutrition')}:</b>
        </div>

        <div class="nutrition">
          <span>${tr('calories')}: ${nutrition.calories}</span>
          <span>${tr('protein')}: ${nutrition.protein}</span>
          <span>${tr('fat')}: ${nutrition.fat}</span>
          <span>${tr('carbohydrates')}: ${nutrition.carbohydrates}</span>
        </div>

        <p class="note">
          ${tr('approx')}
        </p>

        <div class="price">
          ${item.price} сом
        </div>
      </div>
    </article>
  `;
}

function openCategory(id){
  currentCategory=id;
  renderApp();
  window.scrollTo(0,0);
}

function goHome(){
  currentCategory=null;
  renderApp();
  window.scrollTo(0,0);
}

if(localStorage.getItem('navai-lang')){
  renderApp();
}else{
  welcome();
}
